<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <title>Example Data Table with IndexedDB</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Inventario de Productos</h1>
<p class="autor">Desarrollado por Carlos Zepeda Cortes (@ZepedaCortesCarlos)</p>

    <div class="container">

        <div class="formContainer">
            <label for="name">Product Name:</label>
            <input type="text" id="name" placeholder="Enter product name">
            
            <label for="price">Price:</label>
            <input type="number" id="price" placeholder="Enter product price" min="1">
            
            <button id="addProduct">Add Product</button>
        </div>

      <div id="productCounter" class="counter">Total de productos: 0</div>
        <table id="productsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
          
            </tbody>
        </table>
    </div>


    <script src="functions.js"></script>
    <footer>
    <p>© 2026 Carlos Zepeda Cortés - Práctica de Control de Versiones</p>
</footer>
</body>
</html>
